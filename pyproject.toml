[project]
name = "ringivo"
dynamic = ["version"]
description = "Ringivo fax API client for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<0.29",
    # UNCONDITIONAL, AND NOT BECAUSE OF `NotRequired`. This line carried a
    # `python_version < '3.11'` marker for years on the grounds that
    # `NotRequired` moved into `typing` at 3.11 — but the marker never
    # matched how the module imports. src/ringivo/_generated_types.py has
    # ALWAYS written `from typing_extensions import ...` unconditionally, on
    # every interpreter, because that is what the generator emits. So on
    # 3.11+ the import worked only when something else in the tree happened
    # to pull typing-extensions in (httpx → anyio does, on some versions).
    # That is luck, not a contract, and luck runs out silently: an
    # ImportError at import time on a supported interpreter.
    #
    # THE FLOOR IS 4.10 AND IT IS MEASURED, NOT INFERRED — and it is EXACT
    # rather than conservative. The generated module carries
    # `class NumberLookupRequest(TypedDict, closed=True)` — PEP 728, from the
    # spec's `additionalProperties: false`. Loading that exact module against
    # each release: 4.6.0, 4.7.0, 4.7.1, 4.8.0 and 4.9.0 all raise
    # `TypeError: _TypedDictMeta.__new__() got an unexpected keyword argument
    # 'closed'`, while 4.10.0 and 4.11.0 import and construct it. So 4.10 is
    # the first release that works, not merely the lowest one anybody tried.
    #
    # Nothing in CI can catch a floor that is too low — the resolver takes
    # the newest release and every test passes. The `lowest-deps` job in
    # .github/workflows/ci.yml is the exception and the only one: it installs
    # these floors on purpose. It guards the FLOOR but NOT the marker above,
    # for the reason written out there. Re-probe by hand after any
    # regeneration that changes this module's imports.
    "typing-extensions>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ONE source of truth for the version: the module the runtime reads for its
# own User-Agent. A literal here would be a second copy, and the two would
# drift the first time a release was cut in a hurry.
[tool.hatch.version]
path = "src/ringivo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ringivo"]

[dependency-groups]
dev = [
    # httpx pulls anyio in anyway; it is named HERE because the test suite
    # uses its pytest plugin to run the async tests (`@pytest.mark.anyio`),
    # and a transitive dependency is not a promise. Without a plugin pytest
    # FAILS an async test rather than skipping it, so this cannot rot into a
    # silent green — but the failure would be a puzzle rather than a
    # sentence.
    "anyio>=4",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "respx>=0.22",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ruff's own documented defaults, restored explicitly: with no [tool.ruff]
# section at all it was quietly enabling ~415 rules (stylistic pydocstyle/
# flake8-simplify/flake8-pyi opinions included), which is a heavier bar than
# this package holds itself to.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# There is NO `exclude`, and its absence is the point: every file under
# these roots is checked, the machine-written src/ringivo/_generated_types.py
# included. Generated code used to be carved out here on the grounds that a
# regenerate, not an edit, is its fix vector — but the carve-out only ever
# hid what the generator got wrong. The tree it protected shipped a module
# that raised `NameError` the moment anything imported it, and the type
# checker was configured not to look. A generated file outside the checker
# is a claim about its types; inside, it is a checked fact.
include = ["src", "tests"]
