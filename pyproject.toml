[project]
name = "ringivo"
version = "0.0.1"
description = "Ringivo API client for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<0.29",
    "attrs>=22.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringivo"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ruff's own documented defaults, restored explicitly: with no [tool.ruff]
# section at all it was quietly enabling ~415 rules (stylistic pydocstyle/
# flake8-simplify/flake8-pyi opinions included), which is a heavier bar than
# committed generated code should be held to.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# openapi-python-client 0.29.0 omits the `Unset` import for an endpoint
# whose requestBody declares more than one content type — sendFax accepts
# both multipart/form-data and application/json (spec/openapi.yaml, POST
# /v1/faxes). Confirmed present in the raw `--meta none` generator output
# before scripts/generate.sh's rsync/rename step, so this is an upstream
# generator bug, not something the vendoring pipeline introduced. Pinned by
# tests/test_generated_import.py::test_send_fax_endpoint_has_known_generator_bug —
# remove this ignore and that test together if a future generator version
# fixes it. Do not hand-edit the generated file; it is overwritten on the
# next scripts/generate.sh run.
"src/ringivo/_generated/api/faxes/send_fax.py" = ["F821"]

[tool.pyright]
include = ["src", "tests"]
# Generated code is not held to hand-written type-safety: its correctness
# is validated by the import smoke tests in tests/, and the fix vector for
# any generator imprecision is regenerating from a fixed spec/tool version,
# never a local edit (scripts/generate.sh overwrites this directory).
exclude = ["src/ringivo/_generated"]
