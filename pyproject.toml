[project]
name = "ringivo"
dynamic = ["version"]
description = "Ringivo fax API client for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<0.29",
    # `NotRequired`, which src/ringivo/_generated_types.py imports — `typing`
    # only publishes it from 3.11, so the marker is the whole reason this is
    # here and it drops off every newer interpreter. Declared rather than
    # leaned on: httpx pulls anyio, which pulls typing-extensions on these
    # same versions anyway, and a transitive dependency is not a promise.
    "typing-extensions>=4.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ONE source of truth for the version: the module the runtime reads for its
# own User-Agent. A literal here would be a second copy, and the two would
# drift the first time a release was cut in a hurry.
[tool.hatch.version]
path = "src/ringivo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ringivo"]

[dependency-groups]
dev = [
    # httpx pulls anyio in anyway; it is named HERE because the test suite
    # uses its pytest plugin to run the async tests (`@pytest.mark.anyio`),
    # and a transitive dependency is not a promise. Without a plugin pytest
    # FAILS an async test rather than skipping it, so this cannot rot into a
    # silent green — but the failure would be a puzzle rather than a
    # sentence.
    "anyio>=4",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "respx>=0.22",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ruff's own documented defaults, restored explicitly: with no [tool.ruff]
# section at all it was quietly enabling ~415 rules (stylistic pydocstyle/
# flake8-simplify/flake8-pyi opinions included), which is a heavier bar than
# this package holds itself to.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# There is NO `exclude`, and its absence is the point: every file under
# these roots is checked, the machine-written src/ringivo/_generated_types.py
# included. Generated code used to be carved out here on the grounds that a
# regenerate, not an edit, is its fix vector — but the carve-out only ever
# hid what the generator got wrong. The tree it protected shipped a module
# that raised `NameError` the moment anything imported it, and the type
# checker was configured not to look. A generated file outside the checker
# is a claim about its types; inside, it is a checked fact.
include = ["src", "tests"]
